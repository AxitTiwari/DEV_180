<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .container {
            width: 100vw;
            height: 100vh;
            background-color: beige;
            border: 5px solid black;

            display: flex;
            align-items: center;
        }

        .box {
            width: 150px;
            height: 100px;
            background-color: blue;
            border-radius: 20px;
            margin: 10px;
            border: 3px solid black;
            position: relative;

            animation-name: right_move;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-delay: 2s;
            /* animation-direction: reverse; */
            animation-timing-function: cubic-bezier(1, -0.59, 0, 2.21);
            animation-direction: alternate;
        }

        #box1 {
            background-color: blue;
            animation-delay: 0s;
        }

        #box2 {
            background-color: green;
            animation-delay: 1s;
        }

        #box3 {
            background-color: yellow;
            animation-delay: 2s;
        }

        #box4 {
            background-color: orange;
            animation-delay: 3s;
        }

        @keyframes right_move {
            from {
                left: 0;
                right: 0;
            }

            to {
                left: 1200px;
                right: 0;
                background-color: red;
            }
        }


        .top-boxes {
            position: absolute;
            top: 20px;
            left: 20px;

            display: flex;
            gap: 20px;
        }

        #upper,
        #circle,
        #lower {
            width: 100px;
            height: 100px;
            background: red;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="top-boxes">
            <div id="upper"></div>
            <div id="circle"></div>
            <div id="lower"></div>
        </div>

        <div class="box" id="box1">

        </div>

        <div class="box" id="box2">

        </div>

        <div class="box" id="box3">

        </div>

        <div class="box" id="box4">

        </div>
    </div>
</body>
</html>
