<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animations & Transitions Demo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    text-align:center;
}

/* ---------------- Heading Animation ---------------- */

h1{
    color:white;
    margin-bottom:30px;
    animation: floatText 2s ease-in-out infinite alternate;
}

@keyframes floatText{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(-15px);
    }
}

/* ---------------- Card Transition ---------------- */

.card{
    width:250px;
    height:150px;
    background:white;
    border-radius:20px;
    margin:20px auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    transition:all 0.6s ease;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.card:hover{
    transform:rotate(8deg) scale(1.1);
    background:#ffe66d;
    color:red;
}

/* ---------------- Button Transition ---------------- */

button{
    margin-top:20px;
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:#ff4757;
    color:white;
    font-size:18px;
    cursor:pointer;

    transition:all .4s ease;
}

button:hover{
    background:#2ed573;
    transform:scale(1.15);
    letter-spacing:2px;
    box-shadow:0 0 20px lime;
}

/* ---------------- Bouncing Ball Animation ---------------- */

.ball{
    width:70px;
    height:70px;
    background:orange;
    border-radius:50%;
    margin:50px auto;

    animation:bounce 1.2s infinite;
}

@keyframes bounce{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-120px);
    }

    100%{
        transform:translateY(0);
    }

}

/* ---------------- Color Changing Circle ---------------- */

.circle{
    width:90px;
    height:90px;
    border-radius:50%;
    margin:30px auto;

    animation:colorChange 5s linear infinite;
}

@keyframes colorChange{

    0%{
        background:red;
        transform:rotate(0deg);
    }

    25%{
        background:yellow;
    }

    50%{
        background:green;
        transform:rotate(180deg);
    }

    75%{
        background:blue;
    }

    100%{
        background:purple;
        transform:rotate(360deg);
    }

}

</style>

</head>
<body>

<div class="container">

    <h1>CSS Animations & Transitions</h1>

    <div class="card">
        Hover Me
    </div>

    <button>
        Click Me
    </button>

    <div class="ball"></div>

    <div class="circle"></div>

</div>

</body>
</html>
