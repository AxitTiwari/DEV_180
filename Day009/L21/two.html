<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            width: 1000px;
            height: 500px;
            background-color: beige;
            border: 2px solid black;

            display: flex;
        }

        #left_box {
            background-color: yellow;
            width: 47%;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            margin: 5px;
            padding: 5px;
        }

        #right_box {
            background-color: rgb(57, 229, 80);
            width: 47%;
            border: 1px solid black;
            margin: 5px;
            padding: 5px;
        }

        p {
            border: 1px solid red;
        }

        img {
            width: 170px;
        }

        @media (max-width: 640px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">

        <div id="left_box">
            <p>Text 1</p>
            <p>Text 2</p>
        </div>

        <div id="right_box">
            <img src="image.png"/>
        </div>
    </div>
</body>
</html>
