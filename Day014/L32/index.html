<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            background-color: grey;
        }

        .item {
            width: 150px;
            height: 150px;
            background-color: beige;
            border: 2px solid black
        }

        .container {
            background-color: blanchedalmond;
            padding: 5rem;
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(3, 1fr);
        }

        #rotatex:hover {
            transform: rotateX(45deg);
            transition-duration: 1.2s;
        }

        #rotatey:hover {
            transform: rotateY(45deg);
        }

        #rotatez:hover {
            transform: rotateZ(45deg);
        }

        #translatex:hover {
            transform: translateX(100px);
            transition-duration: transform 1.2s;
        }

        #translatey:hover {
            transform: translateY(100px);
            transition-duration: 1.2s;
        }

        #translatez:hover {
            transform:perspective(300px) translateZ(100px);
            transition-duration: 1.2s;
        }

        #scalex:hover {
            transform: scaleX(1.5);
        }

        #scaley:hover {
            transform: scaleY(1.5);
        }

        #scalez:hover {
            transform:perspective(300px) scaleZ(5) rotateY(45deg);
        }
    </style>
</head>
<body>
    
    <div class="container">

        <div class="item" id="rotatex">RotateX</div>
        <div class="item" id="rotatey">RotateY</div>
        <div class="item" id="rotatez">RotateZ</div>
        <div class="item" id="translatex">TranslateX</div>
        <div class="item" id="translatey">TranslateY</div>
        <div class="item" id="translatez">TranslateZ</div>
        <div class="item" id="scalex">ScaleX</div>
        <div class="item" id="scaley">ScaleY</div>
        <div class="item" id="scalez">ScaleZ</div>
    </div>
</body>
</html>
