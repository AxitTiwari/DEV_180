<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>

    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            background-image: linear-gradient( 90.8deg,  rgba(27,53,68,1) 2.2%, rgba(110,180,135,1) 84% );
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            height: 570px;
            background-color: white;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        .card img {
            height: 57%;
            border-radius: 10px;
        }

        .card h2 {
            font-weight: 900;
            font-size: 1.7rem;
        }

        .card p {
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">

            <img src="https://imgs.search.brave.com/EYylQishhW198uFrMO2Z6Lum1Vr8MiepJOTdpXHRVLw/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9xcmZ5/LmNvbS9hc3NldHMv/aG9tZS1mYXFzLWls/bHVzdHJhdGlvbi1C/a2JFcnU3Ty5zdmc">

            <h2>Improve your frontend skills by developing projects</h2>

            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae inventore dolore at ducimus blanditiis! Iste qui obcaecati at.</p>
        </div>
    </div>
    
</body>
</html>
