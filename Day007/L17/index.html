<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        div {
            margin: 20px;
            border: 2px solid black;
        }

        .container {
            height: 8000px;
            background-color: aliceblue;
        }

        img {
            position: relative;
            margin: 10px;
        }

        .image2 {
            top: 100px;
        }

        .image3 {
            position: fixed;
        }

        .image1 {
            position: sticky;
            top: 0px;
        }

        .box {
            background-color: antiquewhite;
            height: 5000px;
        }

        
    </style>
</head>
<body>

    <div class="container">

        <img 
            src="first.png"
            width=250;
            height=250;
            class="image1";
        />

        <img 
            src="second.png"
            width=250;
            height=250;
            class="image2";
        />

        <img
            src="three.png"
            width="350px"
            height="300px"
            class="image3"
        />

    </div>

    <div class="box">

    </div>
    
</body>
</html>
